{% extends "base.html" %}
{% block content %}

<div class="container">
    <h2>Edit Book: #{{ book.pk_id }} - {{ book.title }}</h2>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Save Changes</button>
        <a href="{% url 'pages:index' %}" class="btn" style="margin-left: 10px;">Cancel</a>
    </form>
</div>

{% endblock %}
